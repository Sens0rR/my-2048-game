<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg1: #1a1a2e;
    --bg2: #16213e;
    --board-bg: rgba(255,255,255,0.06);
    --cell-bg: rgba(255,255,255,0.05);
    --text-main: #ffffff;
    --text-sub: rgba(255,255,255,0.6);
    --accent: #667eea;
    --accent2: #764ba2;
  }

  body.light {
    --bg1: #f5f7fa;
    --bg2: #e8ecf3;
    --board-bg: rgba(0,0,0,0.05);
    --cell-bg: rgba(0,0,0,0.04);
    --text-main: #1a1a2e;
    --text-sub: rgba(0,0,0,0.5);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--text-main);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(102,126,234,0.15), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(118,75,162,0.15), transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    max-width: 500px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  h1 {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
    line-height: 1;
  }

  .scores { display: flex; gap: 8px; }

  .score-box {
    background: var(--board-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    min-width: 72px;
    transition: transform 0.2s;
  }

  .score-box.bump { transform: scale(1.12); }

  .score-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-sub);
    font-weight: 600;
  }

  .score-value {
    font-size: 20px;
    font-weight: 700;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .board-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .board {
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1 / 1;
    background: var(--board-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .grid-bg {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }

  .grid-bg div {
    background: var(--cell-bg);
    border-radius: 12px;
  }

  .tile-layer {
    position: absolute;
    inset: 10px;
  }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(20px, 7vw, 40px);
    color: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.12s ease-out;
    will-change: transform;
    box-sizing: border-box;
  }

  .tile.new { animation: popIn 0.18s ease-out; }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; }
  }

  .tile.merged { animation: mergePop 0.22s ease-out; }

  @keyframes mergePop {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.6); }
    100% { filter: brightness(1); }
  }

  .t2    { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); color:#1a1a2e; }
  .t4    { background: linear-gradient(135deg, #c7d2fe, #a5b4fc); color:#1a1a2e; }
  .t8    { background: linear-gradient(135deg, #93c5fd, #60a5fa); }
  .t16   { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
  .t32   { background: linear-gradient(135deg, #a78bfa, #8b5cf6); }
  .t64   { background: linear-gradient(135deg, #c084fc, #a855f7); }
  .t128  { background: linear-gradient(135deg, #f472b6, #ec4899); }
  .t256  { background: linear-gradient(135deg, #fb7185, #f43f5e); }
  .t512  { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
  .t1024 { background: linear-gradient(135deg, #facc15, #eab308); }
  .t2048 { background: linear-gradient(135deg, #fde047, #facc15); box-shadow: 0 0 30px rgba(250,204,21,0.7); }
  .t4096, .t8192 { background: linear-gradient(135deg, #34d399, #10b981); box-shadow: 0 0 30px rgba(16,185,129,0.7); }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-shrink: 0;
  }

  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 8px 24px rgba(102,126,234,0.4);
    font-family: inherit;
  }

  button:active { transform: scale(0.96); }

  button.secondary {
    background: var(--board-bg);
    color: var(--text-main);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: none;
  }

  button:disabled { opacity: 0.4; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
    padding: 20px;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay-card {
    background: linear-gradient(160deg, #1e1e3a, #2a1e4a);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    max-width: 340px;
    width: 100%;
  }

  .overlay-card h2 {
    font-size: 32px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #f093fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .overlay-card p { color: rgba(255,255,255,0.7); margin-bottom: 20px; font-size: 15px; }
  .overlay-card .final-score { font-size: 48px; font-weight: 800; color: #fff; margin: 12px 0 24px; }

  .hint { text-align: center; font-size: 12px; color: var(--text-sub); margin-top: 12px; flex-shrink: 0; }

  #debug {
    position: fixed;
    bottom: 4px;
    left: 4px;
    font-size: 10px;
    color: #fff;
    background: rgba(0,0,0,0.6);
    padding: 2px 6px;
    border-radius: 4px;
    z-index: 999;
    font-family: monospace;
    display: none;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box" id="scoreBox">
        <div class="score-label">Счёт</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Рекорд</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="grid-bg">
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="tile-layer" id="tiles"></div>
    </div>
  </div>

  <div class="controls">
    <button id="newGame" type="button">Новая игра</button>
    <button class="secondary" id="undoBtn" type="button">↶ Отменить</button>
  </div>
  <div class="hint">Свайпай или используй стрелки</div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2 id="overlayTitle">Игра окончена</h2>
    <p id="overlayText">Твой результат:</p>
    <div class="final-score" id="finalScore">0</div>
    <button id="restartBtn" type="button">Играть снова</button>
  </div>
</div>

<div id="debug"></div>

<script>
function dbg(msg) {
  var el = document.getElementById('debug');
  if (el) {
    el.style.display = 'block';
    el.textContent = msg;
    console.log('[2048]', msg);
  }
}

window.addEventListener('error', function(e) {
  dbg('ERR: ' + (e.message || e.error));
});

try {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); } catch(e) {}
    try { tg.expand(); } catch(e) {}
    try { tg.setHeaderColor && tg.setHeaderColor('secondary_bg_color'); } catch(e) {}
    if (tg.colorScheme === 'light') document.body.classList.add('light');
  }

  var SIZE = 4;
  var GAP = 10;
  var grid = [];
  var score = 0;
  var best = 0;
  var tiles = {};
  var nextId = 1;
  var moveHistory = [];
  var cellSize = 0;
  var isAnimating = false;
  var winShown = false;

  var tilesEl, scoreEl, bestEl, scoreBox, overlay, boardEl, undoBtn;

  function $(id) { return document.getElementById(id); }

  function measureBoard() {
    if (!tilesEl) return;
    var w = tilesEl.clientWidth;
    if (w > 0) cellSize = (w - GAP * (SIZE - 1)) / SIZE;
  }

  function positionTile(el, r, c) {
    if (!el || !cellSize) return;
    var x = c * (cellSize + GAP);
    var y = r * (cellSize + GAP);
    el.style.width = cellSize + 'px';
    el.style.height = cellSize + 'px';
    el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }

  function tileClass(v) {
    if (v <= 2048) return 't' + v;
    if (v >= 4096) return 't4096';
    return 't2048';
  }

  function createTileEl(id, t) {
    var el = document.createElement('div');
    el.className = 'tile ' + tileClass(t.value) + (t.isNew ? ' new' : '');
    el.textContent = t.value;
    el.dataset.tid = id;
    tilesEl.appendChild(el);
    t.el = el;
    positionTile(el, t.r, t.c);
    t.isNew = false;
    return el;
  }

  function emptyGrid() {
    var g = [];
    for (var r = 0; r < SIZE; r++) {
      g.push([]);
      for (var c = 0; c < SIZE; c++) g[r].push(null);
    }
    return g;
  }

  function getEmpty() {
    var cells = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (grid[r][c] === null) cells.push({r: r, c: c});
    return cells;
  }

  function addRandom() {
    var empty = getEmpty();
    if (!empty.length) return null;
    var cell = empty[Math.floor(Math.random() * empty.length)];
    var value = Math.random() < 0.9 ? 2 : 4;
    var id = nextId++;
    grid[cell.r][cell.c] = id;
    tiles[id] = { value: value, r: cell.r, c: cell.c, isNew: true };
    return id;
  }

  function updateScore(added) {
    score += added;
    if (scoreEl) scoreEl.textContent = score;
    if (score > best) {
      best = score;
      if (bestEl) bestEl.textContent = best;
      saveBest();
    }
    if (scoreBox) {
      scoreBox.classList.add('bump');
      setTimeout(function() { scoreBox.classList.remove('bump'); }, 150);
    }
  }

  var hasCloud = false;
  function checkCloud() {
    try {
      hasCloud = !!(tg && tg.CloudStorage && typeof tg.CloudStorage.setItem === 'function'
                    && typeof tg.isVersionAtLeast === 'function'
                    && tg.isVersionAtLeast('6.9'));
    } catch(e) { hasCloud = false; }
  }

  function saveBest() {
    try {
      if (hasCloud) {
        tg.CloudStorage.setItem('best2048', String(best), function() {});
      }
      localStorage.setItem('best2048', String(best));
    } catch(e) {}
  }

  function loadBest() {
    try {
      best = parseInt(localStorage.getItem('best2048') || '0') || 0;
      if (bestEl) bestEl.textContent = best;
    } catch(e) { best = 0; }

    if (hasCloud) {
      try {
        tg.CloudStorage.getItem('best2048', function(err, val) {
          if (!err && val) {
            var cloudBest = parseInt(val) || 0;
            if (cloudBest > best) {
              best = cloudBest;
              if (bestEl) bestEl.textContent = best;
              try { localStorage.setItem('best2048', String(best)); } catch(e) {}
            }
          }
        });
      } catch(e) {}
    }
  }

  var hasHaptic = false;
  function checkHaptic() {
    try {
      hasHaptic = !!(tg && tg.HapticFeedback
                     && typeof tg.isVersionAtLeast === 'function'
                     && tg.isVersionAtLeast('6.1'));
    } catch(e) { hasHaptic = false; }
  }

  function haptic(type) {
    if (!hasHaptic) return;
    try {
      if (type === 'light' || type === 'medium' || type === 'heavy') {
        tg.HapticFeedback.impactOccurred(type);
      } else {
        tg.HapticFeedback.notificationOccurred(type);
      }
    } catch(e) {}
  }

  function renderAll() {
    tilesEl.innerHTML = '';
    measureBoard();
    for (var id in tiles) {
      var t = tiles[id];
      t.el = null;
      createTileEl(id, t);
    }
  }

  function saveHistory() {
    var snapshot = {};
    for (var id in tiles) {
      snapshot[id] = { value: tiles[id].value, r: tiles[id].r, c: tiles[id].c };
    }
    moveHistory.push({
      grid: grid.map(function(row) { return row.slice(); }),
      score: score,
      nextId: nextId,
      tiles: snapshot
    });
    if (moveHistory.length > 10) moveHistory.shift();
    if (undoBtn) undoBtn.disabled = false;
  }

  function undo() {
    if (!moveHistory.length || isAnimating) return;
    var state = moveHistory.pop();
    grid = state.grid.map(function(row) { return row.slice(); });
    score = state.score;
    if (scoreEl) scoreEl.textContent = score;
    nextId = state.nextId;
    tiles = {};
    for (var id in state.tiles) {
      tiles[id] = { value: state.tiles[id].value, r: state.tiles[id].r, c: state.tiles[id].c };
    }
    renderAll();
    haptic('light');
    if (!moveHistory.length && undoBtn) undoBtn.disabled = true;
  }

  function canMove() {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (grid[r][c] === null) return true;

    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var t = tiles[grid[r][c]];
        if (!t) return true;
        var v = t.value;
        if (c < SIZE - 1) {
          var t2 = tiles[grid[r][c+1]];
          if (t2 && t2.value === v) return true;
        }
        if (r < SIZE - 1) {
          var t3 = tiles[grid[r+1][c]];
          if (t3 && t3.value === v) return true;
        }
      }
    }
    return false;
  }

  function showOverlay(title, text) {
    var ot = $('overlayTitle'), ox = $('overlayText'), fs = $('finalScore');
    if (ot) ot.textContent = title;
    if (ox) ox.textContent = text;
    if (fs) fs.textContent = score;
    if (overlay) overlay.classList.add('show');
  }

  function move(dir) {
    if (isAnimating) return;
    saveHistory();

    function getLine(i) {
      var line = [];
      for (var j = 0; j < SIZE; j++) {
        var r, c;
        if (dir === 0) { r = j; c = i; }
        else if (dir === 1) { r = i; c = SIZE - 1 - j; }
        else if (dir === 2) { r = SIZE - 1 - j; c = i; }
        else { r = i; c = j; }
        line.push({r: r, c: c});
      }
      return line;
    }

    function targetPos(i, outIndex) {
      if (dir === 0) return { r: outIndex, c: i };
      if (dir === 1) return { r: i, c: SIZE - 1 - outIndex };
      if (dir === 2) return { r: SIZE - 1 - outIndex, c: i };
      return { r: i, c: outIndex };
    }

    var newGrid = emptyGrid();
    var newTiles = {};
    var mergeEvents = [];
    var moved = false;
    var gained = 0;

    for (var i = 0; i < SIZE; i++) {
      var line = getLine(i);
      var items = [];
      for (var li = 0; li < line.length; li++) {
        var rc = line[li];
        var id = grid[rc.r][rc.c];
        if (id !== null && tiles[id]) {
          items.push({ id: id, value: tiles[id].value, el: tiles[id].el, oldR: tiles[id].r, oldC: tiles[id].c });
        }
      }

      var out = 0;
      var k = 0;
      while (k < items.length) {
        var cur = items[k];
        var nxt = items[k + 1];
        var tp = targetPos(i, out);

        if (nxt && nxt.value === cur.value) {
          var newVal = cur.value * 2;
          var newId = nextId++;
          newGrid[tp.r][tp.c] = newId;
          newTiles[newId] = { value: newVal, r: tp.r, c: tp.c, isNew: true, justMerged: true };
          gained += newVal;
          moved = true;
          mergeEvents.push({ el: cur.el, r: tp.r, c: tp.c });
          mergeEvents.push({ el: nxt.el, r: tp.r, c: tp.c });
          k += 2;
        } else {
          newGrid[tp.r][tp.c] = cur.id;
          newTiles[cur.id] = { value: cur.value, r: tp.r, c: tp.c, isNew: false, el: cur.el };
          if (cur.oldR !== tp.r || cur.oldC !== tp.c) moved = true;
          k += 1;
        }
        out++;
      }
    }

    if (!moved) {
      moveHistory.pop();
      if (!moveHistory.length && undoBtn) undoBtn.disabled = true;
      return;
    }

    isAnimating = true;

    for (var id in newTiles) {
      var t = newTiles[id];
      if (t.justMerged) continue;
      if (t.el) positionTile(t.el, t.r, t.c);
    }
    for (var mi = 0; mi < mergeEvents.length; mi++) {
      var ev = mergeEvents[mi];
      if (ev.el) {
        ev.el.style.zIndex = '10';
        positionTile(ev.el, ev.r, ev.c);
      }
    }

    tiles = newTiles;
    grid = newGrid;
    updateScore(gained);
    haptic(gained > 0 ? 'medium' : 'light');

    setTimeout(function() {
      for (var mi = 0; mi < mergeEvents.length; mi++) {
        if (mergeEvents[mi].el && mergeEvents[mi].el.parentNode) {
          mergeEvents[mi].el.parentNode.removeChild(mergeEvents[mi].el);
        }
      }

      for (var id in tiles) {
        var t = tiles[id];
        if (!t.el || !document.body.contains(t.el)) {
          var el = document.createElement('div');
          el.className = 'tile ' + tileClass(t.value) + (t.justMerged ? ' merged' : ' new');
          el.textContent = t.value;
          el.dataset.tid = id;
          tilesEl.appendChild(el);
          t.el = el;
          positionTile(el, t.r, t.c);
          if (t.justMerged) {
            (function(e) { setTimeout(function() { e.classList.remove('merged'); }, 220); })(el);
          }
        } else {
          t.el.className = 'tile ' + tileClass(t.value);
          t.el.textContent = t.value;
          t.el.dataset.tid = id;
          t.el.style.zIndex = '';
        }
        t.justMerged = false;
        t.isNew = false;
      }

      if (!winShown && gained > 0) {
        for (var wid in tiles) {
          if (tiles[wid].value >= 2048) {
            winShown = true;
            haptic('success');
            showOverlay('🎉 Победа!', 'Ты собрал 2048!');
            break;
          }
        }
      }

      var newId = addRandom();
      if (newId !== null && tiles[newId]) {
        createTileEl(newId, tiles[newId]);
      }

      isAnimating = false;

      if (!canMove()) {
        setTimeout(function() {
          haptic('error');
          showOverlay('Игра окончена', 'Твой результат:');
        }, 150);
      }
    }, 140);
  }

  function newGame() {
    grid = emptyGrid();
    tiles = {};
    nextId = 1;
    score = 0;
    if (scoreEl) scoreEl.textContent = '0';
    moveHistory = [];
    if (undoBtn) undoBtn.disabled = true;
    winShown = false;
    isAnimating = false;
    if (tilesEl) tilesEl.innerHTML = '';
    if (overlay) overlay.classList.remove('show');
    measureBoard();
    addRandom();
    addRandom();
    for (var id in tiles) {
      createTileEl(id, tiles[id]);
    }
    haptic('medium');
  }

  function init() {
    tilesEl = $('tiles');
    scoreEl = $('score');
    bestEl = $('best');
    scoreBox = $('scoreBox');
    overlay = $('overlay');
    boardEl = $('board');
    undoBtn = $('undoBtn');

    if (!tilesEl || !boardEl) {
      dbg('Не найдены элементы!');
      return;
    }

    checkCloud();
    checkHaptic();
    loadBest();

    var btnNew = $('newGame');
    var btnRestart = $('restartBtn');
    if (btnNew) btnNew.addEventListener('click', function(e) { e.preventDefault(); newGame(); });
    if (btnRestart) btnRestart.addEventListener('click', function(e) { e.preventDefault(); newGame(); });
    if (undoBtn) undoBtn.addEventListener('click', function(e) { e.preventDefault(); undo(); });

    var tsX = 0, tsY = 0, tsT = 0;
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) return;
      tsX = e.touches[0].clientX;
      tsY = e.touches[0].clientY;
      tsT = Date.now();
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      if (e.changedTouches.length !== 1) return;
      var dx = e.changedTouches[0].clientX - tsX;
      var dy = e.changedTouches[0].clientY - tsY;
      if (Date.now() - tsT > 600) return;
      var ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < 25) return;
      if (ax > ay) move(dx > 0 ? 1 : 3);
      else move(dy > 0 ? 2 : 0);
    }, { passive: true });

    document.addEventListener('keydown', function(e) {
      var map = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3,
                  w: 0, d: 1, s: 2, a: 3 };
      var key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (key in map) { e.preventDefault(); move(map[key]); }
    });

    window.addEventListener('resize', function() {
      measureBoard();
      for (var id in tiles) {
        if (tiles[id].el) positionTile(tiles[id].el, tiles[id].r, tiles[id].c);
      }
    });

    window.addEventListener('orientationchange', function() {
      setTimeout(function() {
        measureBoard();
        for (var id in tiles) {
          if (tiles[id].el) positionTile(tiles[id].el, tiles[id].r, tiles[id].c);
        }
      }, 300);
    });

    requestAnimationFrame(function() {
      measureBoard();
      newGame();
      setTimeout(function() {
        measureBoard();
        for (var id in tiles) {
          if (tiles[id].el) positionTile(tiles[id].el, tiles[id].r, tiles[id].c);
        }
        dbg('OK · cell=' + Math.round(cellSize) + 'px');
      }, 50);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

} catch(err) {
  dbg('CRASH: ' + err.message);
  console.error(err);
}
</script>
</body>
</html>
