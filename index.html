<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eeeef8">
<title>2048</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#eef0fb;--bg2:#e4e6f5;--glass:rgba(255,255,255,.48);--glass2:rgba(255,255,255,.66);
  --cell:rgba(103,113,157,.09);--text:#17172b;--sub:rgba(23,23,43,.52);
  --accent:#667eea;--accent2:#8d4de8;--shadow:rgba(53,58,105,.18);--line:rgba(255,255,255,.72)
}
body.dark{
  --bg1:#151528;--bg2:#20203d;--glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.11);
  --cell:rgba(255,255,255,.055);--text:#fff;--sub:rgba(255,255,255,.58);
  --line:rgba(255,255,255,.11);--shadow:rgba(0,0,0,.34)
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  color:var(--text);background:linear-gradient(155deg,var(--bg1),var(--bg2));
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none
}
body:before,body:after{content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(40px);z-index:0}
body:before{width:65vw;height:65vw;left:-25vw;top:-15vw;background:rgba(116,126,245,.20)}
body:after{width:70vw;height:70vw;right:-30vw;bottom:-20vw;background:rgba(180,91,238,.18)}
button{font:inherit;border:0;color:inherit;cursor:pointer}
.app{position:relative;z-index:1;width:100%;height:100%;max-width:520px;margin:auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.logo-mini{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#eef0ff,#c5c9ff);box-shadow:0 8px 22px var(--shadow),inset 0 1px 1px #fff;display:grid;place-items:center;font-size:25px;font-weight:900;color:#6255ce}
h1{font-size:38px;line-height:.9;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#5d6fea,#8b45df,#d05ce9);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{font-size:10px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-top:5px;font-weight:700}
.scores{display:flex;gap:7px}
.score-box{min-width:69px;padding:7px 10px;border:1px solid var(--line);border-radius:15px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;box-shadow:0 7px 22px var(--shadow),inset 0 1px rgba(255,255,255,.35)}
.score-label{font-size:9px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;font-weight:800}
.score-value{font-size:19px;font-weight:850;margin-top:2px;font-variant-numeric:tabular-nums}
.score-box.bump{animation:scoreBump .18s ease-out}
@keyframes scoreBump{50%{transform:scale(1.12)}}
.board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{
  position:relative;width:min(100%,470px);aspect-ratio:1;border-radius:25px;padding:10px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 24px 70px var(--shadow),inset 0 1px rgba(255,255,255,.45)
}
.grid-bg,.tile-layer{position:absolute;inset:10px}
.grid-bg{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
.grid-bg div{background:var(--cell);border-radius:15px;border:1px solid rgba(255,255,255,.06)}
.tile-layer{pointer-events:none}
.tile{
  position:absolute;left:0;top:0;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-weight:900;box-shadow:0 8px 20px rgba(50,45,110,.20),inset 0 1px rgba(255,255,255,.45);
  transition:transform .115s cubic-bezier(.2,.8,.2,1);will-change:transform
}
.tile.new{animation:pop .18s cubic-bezier(.2,1.4,.4,1)}
.tile.merged{animation:merge .23s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.55)}100%{opacity:1}}
@keyframes merge{0%{filter:brightness(1);transform:scale(1)}45%{filter:brightness(1.45);transform:scale(1.12)}100%{filter:brightness(1);transform:scale(1)}}
.t2{background:linear-gradient(145deg,#f0f2ff,#d8dcff);color:#292946}
.t4{background:linear-gradient(145deg,#dce0ff,#bdc4ff);color:#292946}
.t8{background:linear-gradient(145deg,#a8c8ff,#789df8);color:#fff}
.t16{background:linear-gradient(145deg,#7ca7ff,#4f7ef0);color:#fff}
.t32{background:linear-gradient(145deg,#b49bff,#8a64ec);color:#fff}
.t64{background:linear-gradient(145deg,#ce91ff,#a34fe4);color:#fff}
.t128{background:linear-gradient(145deg,#f59be2,#d95acb);color:#fff}
.t256{background:linear-gradient(145deg,#ff8fb3,#ef4f87);color:#fff}
.t512{background:linear-gradient(145deg,#ffc56a,#f49b2f);color:#fff}
.t1024{background:linear-gradient(145deg,#ffe477,#f1c72e);color:#554300}
.t2048{background:linear-gradient(145deg,#fff09b,#f4cf36);color:#584600;box-shadow:0 0 32px rgba(246,211,55,.58),inset 0 1px #fff}
.t4096{background:linear-gradient(145deg,#76e5c2,#20bd91);color:#fff;box-shadow:0 0 30px rgba(32,189,145,.42)}
.t8192{background:linear-gradient(145deg,#65d9ff,#3f85ee);color:#fff;box-shadow:0 0 30px rgba(63,133,238,.42)}
.t16384{background:linear-gradient(145deg,#b48aff,#7047d9);color:#fff;box-shadow:0 0 30px rgba(112,71,217,.45)}
.t32768{background:linear-gradient(145deg,#ff78d0,#b936b4);color:#fff;box-shadow:0 0 30px rgba(185,54,180,.45)}
.t65536{background:linear-gradient(145deg,#ff7c8f,#dc274e);color:#fff;box-shadow:0 0 30px rgba(220,39,78,.48)}
.controls{display:grid;grid-template-columns:54px 1fr 54px;gap:9px;margin-top:13px;flex-shrink:0}
.btn{
  min-height:50px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-weight:800;box-shadow:0 9px 25px rgba(102,126,234,.30);transition:transform .1s,filter .1s
}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.35;filter:grayscale(.5)}
.btn.secondary{background:var(--glass2);color:var(--text);border:1px solid var(--line);box-shadow:0 7px 20px var(--shadow)}
.hint{text-align:center;color:var(--sub);font-size:11px;margin-top:8px;flex-shrink:0}
.bottom-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;flex-shrink:0}
.nav-btn{padding:10px 5px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:12px;font-weight:750;color:var(--sub);backdrop-filter:blur(15px)}
.nav-btn:active{transform:scale(.96)}
.overlay,.modal{position:fixed;inset:0;z-index:100;background:rgba(8,8,20,.58);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show,.modal.show{opacity:1;pointer-events:auto}
.card{width:min(100%,370px);border-radius:26px;padding:27px 22px;background:linear-gradient(160deg,rgba(35,35,67,.96),rgba(55,34,83,.96));border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 80px rgba(0,0,0,.38);text-align:center;color:#fff}
.card h2{font-size:30px;margin-bottom:7px;background:linear-gradient(135deg,#8998ff,#e48af4);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{font-size:14px;color:rgba(255,255,255,.68);margin-bottom:15px}
.final-score{font-size:48px;font-weight:900;line-height:1;margin:10px 0 22px}
.card-actions{display:flex;gap:8px}.card-actions .btn{flex:1}
.modal-card{width:min(100%,390px);max-height:min(82vh,650px);overflow:auto;border-radius:25px;padding:21px;background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:0 25px 80px var(--shadow)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{font-size:24px}.close{width:36px;height:36px;border-radius:12px;background:var(--cell);font-size:20px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px;border-radius:16px;background:var(--cell);border:1px solid var(--line)}.stat small{display:block;color:var(--sub);font-size:10px;margin-bottom:4px}.stat strong{font-size:20px}
.ach{display:flex;align-items:center;gap:11px;padding:12px;border-radius:15px;background:var(--cell);margin-top:8px}.ach-icon{font-size:24px;width:34px;text-align:center;filter:grayscale(1);opacity:.4}.ach.done .ach-icon{filter:none;opacity:1}.ach b{display:block;font-size:13px}.ach span{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.resume{margin-bottom:12px;padding:11px 13px;border-radius:15px;background:rgba(102,126,234,.12);font-size:12px;color:var(--sub);display:none}.resume.show{display:block}
#debug{position:fixed;left:5px;bottom:4px;z-index:999;font:10px monospace;color:#fff;background:#0009;padding:2px 5px;border-radius:4px;display:none}
@media(max-height:700px){.logo-mini{width:44px;height:44px}.brand h1{font-size:32px}.board{max-width:390px}.controls .btn{min-height:45px}.bottom-nav{margin-top:6px}.hint{margin-top:5px}}
@media(max-width:360px){.app{padding-left:11px;padding-right:11px}.scores{gap:5px}.score-box{min-width:62px;padding:6px 7px}.board{padding:8px}.grid-bg,.tile-layer{inset:8px}.grid-bg{gap:8px}.tile{border-radius:12px}.controls{grid-template-columns:48px 1fr 48px;gap:7px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo-mini">2⁰⁴⁸</div>
      <div><h1>2048</h1><div class="subtitle">glass edition</div></div>
    </div>
    <div class="scores">
      <div class="score-box" id="scoreBox"><div class="score-label">Счёт</div><div class="score-value" id="score">0</div></div>
      <div class="score-box"><div class="score-label">Рекорд</div><div class="score-value" id="best">0</div></div>
    </div>
  </header>

  <div class="resume" id="resume">💾 Найдена сохранённая игра — она будет продолжена.</div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="grid-bg">
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="tile-layer" id="tiles"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn secondary" id="undoBtn" disabled title="Отменить">↶</button>
    <button class="btn" id="newGame">Новая игра</button>
    <button class="btn secondary" id="shareBtn" title="Поделиться">↗</button>
  </div>
  <div class="hint">Свайпай • стрелки • WASD</div>

  <div class="bottom-nav">
    <button class="nav-btn" id="statsBtn">📊 Статистика</button>
    <button class="nav-btn" id="achBtn">🏆 Достижения</button>
    <button class="nav-btn" id="themeBtn">☾ Тема</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2 id="overlayTitle">Игра окончена</h2>
    <p id="overlayText">Твой результат:</p>
    <div class="final-score" id="finalScore">0</div>
    <div class="card-actions">
      <button class="btn secondary" id="shareResult">↗ Поделиться</button>
      <button class="btn" id="restartBtn">Играть снова</button>
    </div>
  </div>
</div>

<div class="modal" id="statsModal">
  <div class="modal-card">
    <div class="modal-head"><h2>📊 Статистика</h2><button class="close" data-close="statsModal">×</button></div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>
</div>

<div class="modal" id="achModal">
  <div class="modal-card">
    <div class="modal-head"><h2>🏆 Достижения</h2><button class="close" data-close="achModal">×</button></div>
    <div id="achList"></div>
  </div>
</div>

<div id="debug"></div>

<script>
(function(){
"use strict";
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
const SIZE=4,GAP=10,STORAGE="2048_glass_state_v2",BEST="best2048";
let grid=[],tiles={},nextId=1,score=0,best=0,history=[],cellSize=0;
let isAnimating=false,winShown=false,continueAfterWin=false,hasCloud=false,hasHaptic=false;
let stats={games:0,wins:0,moves:0,bestTile:0,totalMerges:0};
let els={};

function $(id){return document.getElementById(id)}
function debug(s){let e=$("debug");if(e){e.textContent=s;e.style.display="block"}}
window.addEventListener("error",e=>debug("ERR: "+e.message));

function initTelegram(){
  try{
    if(tg){
      tg.ready(); tg.expand();
      if(tg.isVersionAtLeast&&tg.isVersionAtLeast("6.1")) hasHaptic=!!tg.HapticFeedback;
      if(tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")) hasCloud=!!tg.CloudStorage;
      if(tg.colorScheme==="dark") document.body.classList.add("dark");
      if(tg.BackButton&&tg.BackButton.onClick){
        tg.BackButton.onClick(()=>tg.close());
        tg.BackButton.show();
      }
    }
  }catch(e){}
}
function haptic(type){
  if(!hasHaptic)return;
  try{
    if(["light","medium","heavy"].includes(type))tg.HapticFeedback.impactOccurred(type);
    else tg.HapticFeedback.notificationOccurred(type);
  }catch(e){}
}
function emptyGrid(){return Array.from({length:SIZE},()=>Array(SIZE).fill(null))}
function emptyCells(){
  const a=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]===null)a.push({r,c});return a
}
function addRandom(){
  const e=emptyCells();if(!e.length)return null;
  const p=e[Math.floor(Math.random()*e.length)],id=nextId++;
  grid[p.r][p.c]=id;tiles[id]={value:Math.random()<.9?2:4,r:p.r,c:p.c,isNew:true};
  return id
}
function measure(){
  const w=els.tiles.clientWidth;if(w>0)cellSize=(w-GAP*3)/4
}
function tileClass(v){
  if(v<=65536)return "t"+v;
  return v%2===0&&v>65536?"t65536":"t2048"
}
function pos(el,r,c){
  if(!el||!cellSize)return;
  el.style.width=cellSize+"px";el.style.height=cellSize+"px";
  el.style.fontSize=Math.max(17,Math.min(39,cellSize*(vFont(tiles[el.dataset.tid]?.value)||.38)))+"px";
  el.style.transform=`translate(${c*(cellSize+GAP)}px,${r*(cellSize+GAP)}px)`
}
function vFont(v){if(v>=10000)return .29;if(v>=1000)return .33;if(v>=100)return .36;return .40}
function makeEl(id,t){
  const e=document.createElement("div");e.className="tile "+tileClass(t.value)+(t.isNew?" new":"");
  e.textContent=t.value;e.dataset.tid=id;els.tiles.appendChild(e);t.el=e;pos(e,t.r,t.c);t.isNew=false;return e
}
function render(){
  els.tiles.innerHTML="";measure();
  Object.keys(tiles).forEach(id=>makeEl(id,tiles[id]))
}
function updateScore(add){
  score+=add;els.score.textContent=score;
  if(score>best){best=score;els.best.textContent=best;saveBest()}
  if(add){els.scoreBox.classList.remove("bump");void els.scoreBox.offsetWidth;els.scoreBox.classList.add("bump")}
}
function saveBest(){
  try{localStorage.setItem(BEST,String(best))}catch(e){}
  if(hasCloud)try{tg.CloudStorage.setItem(BEST,String(best),()=>{})}catch(e){}
}
function loadBest(){
  try{best=Number(localStorage.getItem(BEST))||0}catch(e){best=0}
  els.best.textContent=best;
  if(hasCloud)try{tg.CloudStorage.getItem(BEST,(err,v)=>{
    const b=Number(v)||0;if(!err&&b>best){best=b;els.best.textContent=best;try{localStorage.setItem(BEST,String(best))}catch(e){}}
  })}catch(e){}
}
function saveState(){
  try{
    const state={v:2,grid,tiles:Object.fromEntries(Object.entries(tiles).map(([id,t])=>[id,{value:t.value,r:t.r,c:t.c}])),
      nextId,score,best,winShown,continueAfterWin,stats};
    localStorage.setItem(STORAGE,JSON.stringify(state))
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE);if(!raw)return false;
    const s=JSON.parse(raw);
    if(!s||!s.grid||!s.tiles)return false;
    grid=s.grid;tiles={};Object.keys(s.tiles).forEach(id=>tiles[id]={...s.tiles[id],isNew:false});
    nextId=s.nextId||1;score=s.score||0;best=Math.max(best,s.best||0);winShown=!!s.winShown;continueAfterWin=!!s.continueAfterWin;
    if(s.stats)stats={...stats,...s.stats};
    els.score.textContent=score;els.best.textContent=best;render();
    els.resume.classList.add("show");return true
  }catch(e){return false}
}
function clearSaved(){try{localStorage.removeItem(STORAGE)}catch(e){}}
function snapshot(){
  return {grid:grid.map(r=>r.slice()),score,nextId,tiles:Object.fromEntries(Object.entries(tiles).map(([id,t])=>[id,{value:t.value,r:t.r,c:t.c}]))}
}
function restore(s){
  grid=s.grid.map(r=>r.slice());score=s.score;nextId=s.nextId;tiles={};
  Object.keys(s.tiles).forEach(id=>tiles[id]={...s.tiles[id],isNew:false});
  els.score.textContent=score;render()
}
function undo(){
  if(!history.length||isAnimating)return;
  restore(history.pop());els.undoBtn.disabled=!history.length;saveState();haptic("light")
}
function canMove(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(grid[r][c]===null)return true;
    const t=tiles[grid[r][c]],v=t?.value;
    if(c<3&&tiles[grid[r][c+1]]?.value===v)return true;
    if(r<3&&tiles[grid[r+1][c]]?.value===v)return true;
  }return false
}
function move(dir){
  if(isAnimating)return;
  const before=snapshot();
  const getLine=i=>{
    const a=[];for(let j=0;j<4;j++){
      let r,c;
      if(dir===0){r=j;c=i}else if(dir===1){r=i;c=3-j}else if(dir===2){r=3-j;c=i}else{r=i;c=j}
      a.push({r,c})
    }return a
  };
  const target=(i,o)=>dir===0?{r:o,c:i}:dir===1?{r:i,c:3-o}:dir===2?{r:3-o,c:i}:{r:i,c:o};
  const ng=emptyGrid(),nt={},merges=[];let moved=false,gained=0;
  for(let i=0;i<4;i++){
    const items=getLine(i).map(p=>({p,id:grid[p.r][p.c]})).filter(x=>x.id!==null&&tiles[x.id]).map(x=>({
      id:x.id,value:tiles[x.id].value,el:tiles[x.id].el,oldR:tiles[x.id].r,oldC:tiles[x.id].c
    }));
    let out=0;
    for(let k=0;k<items.length;){
      const a=items[k],b=items[k+1],p=target(i,out);
      if(b&&a.value===b.value){
        const nid=nextId++,nv=a.value*2;ng[p.r][p.c]=nid;
        nt[nid]={value:nv,r:p.r,c:p.c,isNew:true,justMerged:true};
        merges.push({el:a.el,r:p.r,c:p.c},{el:b.el,r:p.r,c:p.c});gained+=nv;moved=true;stats.totalMerges++;k+=2
      }else{
        ng[p.r][p.c]=a.id;nt[a.id]={value:a.value,r:p.r,c:p.c,el:a.el,isNew:false};
        if(a.oldR!==p.r||a.oldC!==p.c)moved=true;k++
      }out++
    }
  }
  if(!moved)return;
  history.push(before);if(history.length>10)history.shift();els.undoBtn.disabled=false;
  isAnimating=true;
  Object.values(nt).forEach(t=>{if(t.el&&!t.justMerged)pos(t.el,t.r,t.c)});
  merges.forEach(m=>{if(m.el){m.el.style.zIndex=10;pos(m.el,m.r,m.c)}});
  tiles=nt;grid=ng;stats.moves++;updateScore(gained);haptic(gained?"medium":"light");saveState();
  setTimeout(()=>{
    merges.forEach(m=>{if(m.el?.parentNode)m.el.parentNode.removeChild(m.el)});
    Object.keys(tiles).forEach(id=>{
      const t=tiles[id];
      if(!t.el||!document.body.contains(t.el))makeEl(id,t);
      else{t.el.className="tile "+tileClass(t.value)+(t.justMerged?" merged":"");t.el.textContent=t.value;t.el.style.zIndex="";pos(t.el,t.r,t.c)}
      t.justMerged=false;t.isNew=false
    });
    const max=Math.max(...Object.values(tiles).map(t=>t.value));
    stats.bestTile=Math.max(stats.bestTile,max);
    if(max>=2048&&!winShown){
      winShown=true;stats.wins++;haptic("success");showOverlay("🎉 Победа!","Ты собрал 2048!");
      saveState()
    }
    const id=addRandom();if(id)makeEl(id,tiles[id]);
    isAnimating=false;saveState();
    if(!canMove())setTimeout(()=>{haptic("error");showOverlay("Игра окончена","Ходов больше нет.")},120)
  },125)
}
function newGame(){
  if(isAnimating)return;
  grid=emptyGrid();tiles={};nextId=1;score=0;history=[];winShown=false;continueAfterWin=false;
  stats.games++;els.score.textContent="0";els.undoBtn.disabled=true;els.resume.classList.remove("show");
  els.overlay.classList.remove("show");addRandom();addRandom();render();saveState();haptic("medium")
}
function showOverlay(title,text){
  els.overlayTitle.textContent=title;els.overlayText.textContent=text;els.finalScore.textContent=score;els.overlay.classList.add("show")
}
function format(n){return Number(n||0).toLocaleString("ru-RU")}
function statsRender(){
  els.statsGrid.innerHTML=[
    ["Рекорд",format(best)],["Лучший тайл",format(stats.bestTile)],["Игр сыграно",format(stats.games)],
    ["Побед",format(stats.wins)],["Всего ходов",format(stats.moves)],["Слияний",format(stats.totalMerges)]
  ].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("")
}
const achievements=[
  ["🥚","Первые шаги","Собери 128",s=>s.bestTile>=128],
  ["🔥","Разогрелся","Собери 512",s=>s.bestTile>=512],
  ["🏆","2048","Собери 2048",s=>s.bestTile>=2048],
  ["👑","Монстр","Собери 4096",s=>s.bestTile>=4096],
  ["💎","За гранью","Собери 8192",s=>s.bestTile>=8192],
  ["⚡","Марафонец","Сделай 500 ходов",s=>s.moves>=500],
  ["🎮","Завис","Сыграй 25 игр",s=>s.games>=25]
];
function achRender(){
  els.achList.innerHTML=achievements.map(a=>{
    const done=a[3](stats);return `<div class="ach ${done?"done":""}"><div class="ach-icon">${a[0]}</div><div><b>${a[1]}</b><span>${a[2]}</span></div></div>`
  }).join("")
}
function share(){
  const text=`🎮 Я играю в 2048!\n\nСчёт: ${format(score)}\nРекорд: ${format(best)}\nЛучший тайл: ${format(stats.bestTile)}\n\nПопробуешь побить? 😎`;
  const url=location.href;
  try{
    if(tg&&tg.openTelegramLink){
      tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(url)+"&text="+encodeURIComponent(text));return
    }
  }catch(e){}
  if(navigator.share)navigator.share({title:"2048",text,url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(text+"\\n"+url).then(()=>haptic("success"))
}
function theme(){
  document.body.classList.toggle("dark");
  try{localStorage.setItem("2048_theme",document.body.classList.contains("dark")?"dark":"light")}catch(e){}
}
function loadTheme(){
  try{
    const t=localStorage.getItem("2048_theme");
    if(t==="dark")document.body.classList.add("dark");
    if(t==="light")document.body.classList.remove("dark")
  }catch(e){}
}
function closeModal(id){$(id).classList.remove("show")}
function init(){
  els={tiles:$("tiles"),score:$("score"),best:$("best"),scoreBox:$("scoreBox"),board:$("board"),undoBtn:$("undoBtn"),
    overlay:$("overlay"),overlayTitle:$("overlayTitle"),overlayText:$("overlayText"),finalScore:$("finalScore"),resume:$("resume"),
    statsModal:$("statsModal"),achModal:$("achModal"),statsGrid:$("statsGrid"),achList:$("achList")};
  initTelegram();loadTheme();loadBest();
  $("newGame").onclick=()=>newGame();$("restartBtn").onclick=()=>newGame();$("undoBtn").onclick=()=>undo();
  $("shareBtn").onclick=share;$("shareResult").onclick=share;
  $("statsBtn").onclick=()=>{statsRender();els.statsModal.classList.add("show")};
  $("achBtn").onclick=()=>{achRender();els.achModal.classList.add("show")};$("themeBtn").onclick=theme;
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
  [els.statsModal,els.achModal].forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("show")}));
  let sx=0,sy=0,st=0;
  document.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()}},{passive:true});
  document.addEventListener("touchend",e=>{
    if(e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Date.now()-st>650)return;const ax=Math.abs(dx),ay=Math.abs(dy);if(Math.max(ax,ay)<28)return;
    move(ax>ay?(dx>0?1:3):(dy>0?2:0))
  },{passive:true});
  document.addEventListener("keydown",e=>{
    const m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};
    const k=e.key.length===1?e.key.toLowerCase():e.key;if(k in m){e.preventDefault();move(m[k])}
    if(e.key==="Escape"){els.statsModal.classList.remove("show");els.achModal.classList.remove("show");els.overlay.classList.remove("show")}
  });
  const resize=()=>{measure();Object.values(tiles).forEach(t=>t.el&&pos(t.el,t.r,t.c))};
  addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,250));
  requestAnimationFrame(()=>{
    measure();
    if(!loadState()){newGame()}else{els.score.textContent=score;els.best.textContent=best}
    setTimeout(resize,50)
  });
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
</body>
</html>
